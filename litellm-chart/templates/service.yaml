apiVersion: v1
kind: Service
metadata:
  name: litellm-svc
  namespace: {{ .Values.namespace }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: {{ .Values.service.type }}
  selector:
    app: litellm
  ports:
  - protocol: TCP
    port: 80
    targetPort: 4000